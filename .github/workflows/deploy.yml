name: Deploy Astro to GitHub Pages

on:
  push:
    branches: ['main']
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'README*'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run Playwright E2E tests'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  # Build job: builds site, generates SEO artifacts
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Approve build scripts
        run: pnpm approve-builds esbuild

      - name: Install dependencies
        run: pnpm install --ignore-scripts=false

      - name: Build Astro site
        run: pnpm run build:full

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # Linting - runs in parallel with build
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Approve build scripts
        run: pnpm approve-builds esbuild

      - name: Install dependencies
        run: pnpm install --ignore-scripts=false

      - name: Run ESLint
        run: pnpm run lint

  # TypeScript/Astro diagnostics - runs in parallel with build
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Approve build scripts
        run: pnpm approve-builds esbuild

      - name: Install dependencies
        run: pnpm install --ignore-scripts=false

      - name: Run Astro check
        run: pnpm run check

  # Unit tests - runs in parallel with build and lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Approve build scripts
        run: pnpm approve-builds esbuild

      - name: Install dependencies
        run: pnpm install --ignore-scripts=false

      - name: Unit tests
        run: pnpm test

  # Browser regression tests against the built site
  e2e:
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Approve build scripts
        run: pnpm approve-builds esbuild

      - name: Install dependencies
        run: pnpm install --ignore-scripts=false

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact

      - name: Extract built site
        run: mkdir -p dist && tar -xf artifact/artifact.tar -C dist && rm -rf artifact

      - name: Run E2E tests
        run: pnpm exec playwright test --reporter=line

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, lint, check, test]
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment